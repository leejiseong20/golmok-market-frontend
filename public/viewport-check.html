<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>화면 크기 진단</title>
<style>
  /* 앱과 무관한 임시 진단 페이지. 확인이 끝나면 지운다. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #14120f;
    color: #f5f1ea;
    /* 스크롤이 생기지 않게 화면 두 배 높이의 여백을 두지 않는다. */
    height: 100dvh;
    overflow: hidden;
  }

  /*
   * 확인 1) 화면에 고정한 막대. iOS 크롬에서 키보드가 올라왔을 때
   * 이 막대가 키보드 "위"에 보이는지, 키보드 "뒤"로 숨는지가 핵심이다.
   */
  .pinned {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    background: #1e1a16;
    border-top: 2px solid #dd5c37;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tag { font-size: 12px; color: #dd5c37; font-weight: 700; margin-bottom: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 13px; }
  .grid div { display: flex; justify-content: space-between; gap: 6px; }
  .grid b { font-variant-numeric: tabular-nums; }
  .ok { color: #7fd6a8; }
  .no { color: #ff8f78; }
  input { width: 100%; font-size: 16px; padding: 10px 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #463f35; background: #221e19; color: #f5f1ea; }
  .hint { padding: 12px 16px; font-size: 14px; line-height: 1.6; color: #bcb3a6; }
</style>
</head>
<body>
  <p class="hint">
    아래 주황색 막대는 <b>화면에 고정</b>돼 있습니다.<br />
    입력칸을 눌러 키보드를 올린 뒤, <b>막대가 키보드 위에 보이는지</b> 확인하고 그 상태로 캡처해 주세요.
  </p>

  <div class="pinned">
    <div class="tag">고정 막대 (position: fixed; bottom: 0)</div>
    <div class="grid" id="grid"></div>
    <input id="probe" placeholder="여기를 눌러 키보드를 올려 주세요" />
  </div>

<script>
  const grid = document.getElementById("grid");
  const cell = (label, value, state) => `<div><span>${label}</span><b class="${state || ""}">${value}</b></div>`;

  function render() {
    const vv = window.visualViewport;
    const kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height)) : 0;
    const open = kb > 120;
    const bar = document.querySelector(".pinned").getBoundingClientRect();
    const visibleBottom = vv ? Math.round(vv.offsetTop + vv.height) : window.innerHeight;

    grid.innerHTML = [
      cell("지원", vv ? "O" : "X", vv ? "ok" : "no"),
      cell("innerH", window.innerHeight),
      cell("보이는H", vv ? Math.round(vv.height) : "-"),
      cell("offsetTop", vv ? Math.round(vv.offsetTop) : "-"),
      cell("키보드", kb, kb > 0 ? "ok" : ""),
      cell("판정", open ? "열림" : "닫힘", open ? "ok" : ""),
      cell("scrollY", Math.round(window.scrollY)),
      cell("막대top", Math.round(bar.top)),
      cell("보이는바닥", visibleBottom),
      cell("막대가", bar.top < visibleBottom ? "보임" : "가려짐", bar.top < visibleBottom ? "ok" : "no"),
    ].join("");
  }

  render();
  window.visualViewport?.addEventListener("resize", render);
  window.visualViewport?.addEventListener("scroll", render);
  window.addEventListener("resize", render);
  window.addEventListener("scroll", render);
  document.getElementById("probe").addEventListener("focus", () => {
    [200, 500, 900].forEach((delay) => setTimeout(render, delay));
  });
  setInterval(render, 1000);
</script>
</body>
</html>
