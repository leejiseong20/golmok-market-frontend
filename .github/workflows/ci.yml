# 푸시할 때마다 단위 테스트 → 빌드 → 모킹 E2E 를 돌린다.
# 실제 서버 E2E(product-write·review)는 MySQL 백엔드가 필요해 여기서 돌리지 않는다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: 단위 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      # E2E 는 API 를 모킹해 백엔드 없이 돈다. 브라우저는 이 작업에서만 받는다(로컬은 설치된 Chrome 을 쓴다).
      - name: E2E 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 모킹 E2E
        run: npm run test:e2e
      - name: 실패하면 결과 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
